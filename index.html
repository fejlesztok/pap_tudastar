<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pénzügyi fogalmak kereső</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-dark:#2e6431; --green-light:#add488; --green-bg:#f3ffe6; --maxw:720px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial,'Noto Sans','Liberation Sans',sans-serif;color:#0e1b12;display:flex;justify-content:center}
  .container{width:100%;max-width:var(--maxw);padding:24px 16px 48px}
  .title{font-weight:700;font-size:33.3px;color:var(--green-dark);margin:0 0 16px 0}
  .search-wrap{display:flex;align-items:center;background:linear-gradient(90deg,var(--green-dark),var(--green-light));border-radius:16px;padding:2px;margin-bottom:8px}
  .search-inner{position:relative;flex:1;display:flex;align-items:center;background:linear-gradient(90deg,var(--green-dark),var(--green-light));border-radius:14px}
  #searchInput{width:100%;border:0;outline:none;padding:14px 44px 14px 16px;background:transparent;color:#fff;font-weight:300;font-size:16px;caret-color:#fff}
  #searchInput::placeholder{color:#fff;opacity:.9}
  .search-icon{position:absolute;right:12px;font-size:18px;line-height:1;user-select:none}
  /* History bar */
  .history{display:none;margin:8px 0 8px 0;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;padding:6px 10px;background:var(--green-bg);color:var(--green-dark);border-radius:999px;font-size:13px;cursor:pointer;border:1px solid #e2f6c9}
  .chip:hover{background:#eaffc2}
  /* Results */
  .results{display:none;margin-top:4px}
  .result-item{background:var(--green-bg);border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer;border:1px solid #e8f5d7}
  .result-item:focus,.result-item:hover{outline:2px solid #cdecb1}
  .result-title{font-weight:700;color:var(--green-dark);margin-bottom:4px}
  .result-snippet{font-weight:300;color:#1f2a22;font-size:14px}
  /* Definition */
  .definition{display:none;margin-top:12px;background:linear-gradient(135deg,var(--green-dark),var(--green-light));color:#fff;border-radius:16px;padding:18px}
  .definition h2{margin:0 0 8px 0;font-size:20px;font-weight:700}
  .definition p{margin:0;font-weight:300;white-space:pre-wrap}
</style>
</head>
<body>
  <div class="container">
    <h1 class="title">Pénzügyi fogalmak kereső</h1>

    <div class="search-wrap">
      <div class="search-inner">
        <input id="searchInput" type="text" inputmode="search" autocomplete="off" placeholder="Keresés a fogalmak között…" aria-label="Keresés a fogalmak között…">
        <div class="search-icon" aria-hidden="true">🔍</div>
      </div>
    </div>

    <!-- History bar (last 10 selections) -->
    <div id="history" class="history" aria-live="polite"></div>

    <!-- Live results while typing -->
    <div id="results" class="results" role="listbox" aria-label="Találatok"></div>

    <!-- Selected definition -->
    <article id="definition" class="definition" aria-live="polite" aria-atomic="true"></article>
  </div>

<script src="./data/fogalmak.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
